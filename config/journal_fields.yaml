# Journal field definitions (PRD 6.4). The describe form (in this order), the AI extraction
# schema and digest breakdowns are generated from this file. Validated at API start.
#
# Field keys:
#   key            stable snake_case id (a trades column, or a key in trades.extra)
#   label          Ukrainian label shown in the UI
#   type           enum | multi_enum | bool | int | text | links | auto
#                  (auto = computed by the app, the user may override; links = chart links)
#   options        enum/multi_enum/auto/links: list of {value, label, deprecated}
#                  (rule_violations: no options here, they come from violations.yaml)
#                  `value` is stored in the DB: never rename or delete it, set
#                  `deprecated: true` instead so old trades keep their value.
#   required       a trade cannot be "complete" without it (links: at least one "before" link)
#   analytics      used in digest breakdowns
#   storage        column (real trades column; multi_enum: a VARCHAR(50)[] column)
#                  | extra (JSONB trades.extra, experimental fields)
#   text_key       optional free text stored next to an option field
#   allow_other_text  true: text_key is the text for the "other" option only (multi_enum:
#                     when "other" is in the list); "other" without text blocks "complete"
#                     false: text_key is an optional note for any value
#   show_if        {field: <key>, includes: <option value>}: the field (and its text_key) is
#                  shown, required and AI-fillable only when that earlier enum/multi_enum
#                  field equals / contains the option; hidden values are cleared on save
#   legacy         true: read-only old field («Старе значення»), shown only when a trade
#                  has a value; never written, required, analysed or AI-filled
#   min, max       int fields only
#   phase          before (default) | after: after-trade fields stay empty while the
#                  position is open (M8-02); not allowed for auto and links fields
#
# YAML note: yes/no/on/off are plain strings in this file (only true/false are booleans).

fields:
  - key: h1_context
    label: "Контекст H1"
    type: enum
    options: &contexts
      - { value: flow, label: "Flow" }
      - { value: reversal, label: "Reversal" }
      - { value: range, label: "Range" }
      - { value: other, label: "Інше" }
    required: true
    analytics: true
    storage: column
    text_key: h1_context_other
    allow_other_text: true

  - key: h4_context
    label: "Контекст H4"
    type: enum
    options: *contexts
    required: true
    analytics: true
    storage: column
    text_key: h4_context_other
    allow_other_text: true

  - key: poi_types
    label: "POI"
    type: multi_enum
    options:
      - { value: fvg_h4, label: "FVG H4" }
      - { value: fvg_h1, label: "FVG H1" }
      - { value: fractal_h1, label: "Fractal H1" }
      - { value: fractal_h4, label: "Fractal H4" }
      - { value: other, label: "Інше" }
    required: true
    analytics: true
    storage: column
    text_key: poi_types_other
    allow_other_text: true

  - key: fvg_types_h1
    label: "Тип FVG H1"
    type: multi_enum
    options: &fvg_types
      - { value: fractal_updating, label: "оновлює фрактал" }
      - { value: post_manipulation, label: "після маніпуляції" }
      - { value: other, label: "Інше" }
    required: true
    analytics: true
    storage: column
    text_key: fvg_types_h1_other
    allow_other_text: true
    show_if: { field: poi_types, includes: fvg_h1 }

  - key: fvg_types_h4
    label: "Тип FVG H4"
    type: multi_enum
    options: *fvg_types
    required: true
    analytics: true
    storage: column
    text_key: fvg_types_h4_other
    allow_other_text: true
    show_if: { field: poi_types, includes: fvg_h4 }

  - key: entry_model
    label: "Модель входу"
    type: enum
    options:
      - { value: ifvg_m5, label: "IFVG M5" }
      - { value: qm_m5, label: "QM M5" }
      - { value: other, label: "Інше" }
    required: true
    analytics: true
    storage: column
    text_key: entry_model_other
    allow_other_text: true

  # --- Old fields (M8-04..08), read-only: values the new fields could not take exactly ---
  - key: setup_context
    label: "Контекст (Flow H1 синхронний з H4)"
    type: enum
    options:
      - { value: yes, label: "так" }
      - { value: no, label: "ні" }
      - { value: partially, label: "частково" }
    required: false
    analytics: false
    storage: column
    legacy: true

  - key: fvg_kind
    label: "Тип FVG (старе)"
    type: enum
    options:
      - { value: fractal_updating, label: "оновлює фрактал" }
      - { value: post_manipulation, label: "після маніпуляції" }
      - { value: na, label: "н/з" }
    required: false
    analytics: false
    storage: column
    legacy: true

  - key: exit_reason
    label: "Причина виходу"
    type: enum
    options:
      - { value: fractal_update, label: "оновлення фракталу" }
      - { value: point_b, label: "ціль: точка B" }
      - { value: sl, label: "SL" }
      - { value: tp, label: "TP" }
      - { value: stop_out, label: "стоп-аут" }
      - { value: manual, label: "вручну" }
      - { value: other, label: "інше" }
    required: true
    analytics: true
    storage: column
    phase: after

  # Computed from the bias entries (PRD 6.6); the user may override it with a reason.
  # Not required: the app fills it, it never blocks completing a trade.
  - key: bias_alignment
    label: "Відповідність біасу"
    type: auto
    options:
      - { value: aligned, label: "за біасом" }
      - { value: counter, label: "проти біасу" }
      - { value: neutral_bias, label: "нейтральний біас" }
      - { value: no_bias, label: "без біасу" }
    required: false
    analytics: true
    storage: column

  - key: followed_plan
    label: "Дотримався плану"
    type: bool
    required: true
    analytics: true
    storage: column
    phase: after

  # Auto-detected by the rules engine (config/rules.yaml) plus user-added. The options
  # (keys, labels, deprecated) come from config/violations.yaml: add a violation there.
  - key: rule_violations
    label: "Порушення правил"
    type: multi_enum
    required: false
    analytics: true
    storage: column

  - key: emotion_before
    label: "Емоція до входу"
    type: enum
    options: &emotions
      - { value: calm, label: "спокій" }
      - { value: confidence, label: "впевненість" }
      - { value: fomo, label: "FOMO" }
      - { value: fear, label: "страх" }
      - { value: revenge, label: "реванш" }
      - { value: fatigue, label: "втома" }
      - { value: boredom, label: "нудьга" }
    required: true
    analytics: true
    storage: column
    text_key: emotion_before_text
    allow_other_text: false

  - key: emotion_after
    label: "Емоція після угоди"
    type: enum
    options: *emotions
    required: true
    analytics: true
    storage: column
    phase: after
    text_key: emotion_after_text
    allow_other_text: false

  - key: mistakes
    label: "Помилки"
    type: text
    required: false
    analytics: false
    storage: column
    phase: after

  - key: lesson
    label: "Урок"
    type: text
    required: false
    analytics: false
    storage: column
    phase: after

  - key: quality_rating
    label: "Якість сетапу (1–5, незалежно від результату)"
    type: int
    min: 1
    max: 5
    required: true
    analytics: true
    storage: column

  - key: chart_links
    label: "Посилання на графік (TradingView)"
    type: links
    options:
      - { value: before, label: "до входу" }
      - { value: after, label: "після угоди" }
    required: true
    analytics: false
    storage: column
