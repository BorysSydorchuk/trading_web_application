# Слова-числа для AI-розбору опису угоди (наприклад, оцінка якості сетапу).
# Number words the AI extraction accepts for number fields (e.g. the setup quality rating).
#
# Можна додавати свої слова чи фрази: число, двокрапка, список слів.
# Add your own words or phrases: the number, a colon, a list of words.
#
#   - регістр, ё/е та апостроф (' ’ ʼ) не важливі: "Четвёрка" = "четверка", "п’ять" = "п'ять";
#     case, ё/е and the apostrophe style do not matter;
#   - слово рахується лише цілим словом ("четвірками" не рахується як 4),
#     тому знахідний відмінок записаний окремо ("на трійку");
#     only whole words count, so the accusative forms are listed too;
#   - одне слово не може означати два різні числа.
#     a word may not mean two different numbers.
#
# Зміни підхоплюються без перезапуску. Changes are picked up without a restart.

number_words:
  1: [один, одна, одиниця, одиницю, одиничка, одиничку, единица, единицу, единичка, единичку, one]
  2: [два, дві, двійка, двійку, двойка, двойку, two]
  3: [три, трійка, трійку, тройка, тройку, three]
  4: [чотири, четыре, четвірка, четвірку, четверка, четверку, four]
  5: [п'ять, пять, п'ятірка, п'ятірку, пятерка, пятерку, five]
