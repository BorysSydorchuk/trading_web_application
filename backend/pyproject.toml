[project]
name = "trading-journal-backend"
version = "0.1.0"
description = "Trading Journal backend: FastAPI API and MT5 sync worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.4.0",
    "apscheduler>=3,<4",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "metatrader5>=5.0.45 ; sys_platform == 'win32'",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.uv]
# faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), which PyAV 19 removed
# (every transcription failed with a TypeError). Drop when faster-whisper supports av 19.
constraint-dependencies = ["av<19"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez (no naive datetimes)
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "S",   # flake8-bandit (security)
]
# Text I/O without `encoding=` is caught by tests/test_encoding_guard.py (AST scan), not by
# ruff's PLW1514: that rule needs `preview`, which also changes stable rules on upgrades.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type information.
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# faster-whisper ships no type information (imported lazily in app.services.transcriber).
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x nudges TestClient users towards httpx2; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
